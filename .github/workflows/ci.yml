name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # PHP and the PHP dark-slide, because tests/parity.test.ts and
      # tests/reader-parity.test.ts diff this port against it byte-for-byte —
      # the strongest guarantee this pair has. Until now CI installed Node only,
      # so `skipIf(!HAS_PHP)` quietly skipped both suites and the build went
      # green with ZERO cross-engine coverage. They now throw in CI instead of
      # skipping, so forgetting this step fails loudly rather than silently.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          extensions: mbstring, zip

      - name: Check out the PHP dark-slide
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/dark-slide
          path: .php-dark-slide

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Test
        run: npm test
        env:
          # The parity helpers autoload the PHP sources from here. They used to
          # hard-code ../../dark-slide/src, which only resolves inside the .agi
          # envelope — so outside it, the suites found no classes at all.
          DARK_SLIDE_PHP_SRC: ${{ github.workspace }}/.php-dark-slide/src

      - name: Build
        run: npm run build
